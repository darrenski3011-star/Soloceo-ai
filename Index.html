<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soloco AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

header {
  text-align: center;
  padding: 40px 20px;
  background: #111827;
}

header h1 {
  font-size: 42px;
  margin: 0;
}

header p {
  color: #94a3b8;
  font-size: 18px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 25px;
}

.card {
  background: #1e293b;
  padding: 25px;
  margin-top: 25px;
  border-radius: 16px;
}

textarea {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  margin: 15px 0;
  min-height: 130px;
}

button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: #38bdf8;
  color: #082f49;
  font-size: 18px;
  font-weight: bold;
}

#result {
  margin-top: 25px;
  line-height: 1.7;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<header>
  <h1>Soloco AI</h1>
  <p>Your AI-powered business builder</p>
</header>

<div class="container">

  <div class="card">
    <h2>Build Your Business</h2>

    <p>
      Tell us what kind of business you want to create.
      Soloco AI will help turn the idea into a business plan.
    </p>

    <textarea id="idea"
      placeholder="Example: I want to start a business helping local contractors get more customers..."></textarea>

    <button onclick="buildBusiness()">
      Build My Business
    </button>

    <div id="result"></div>
  </div>

</div>

<script>

function buildBusiness() {

  const idea = document.getElementById("idea").value;
  const result = document.getElementById("result");

  if (!idea.trim()) {
    result.innerText = "Enter your business idea first.";
    return;
  }

  result.innerText =
`SOLОCO AI BUSINESS BLUEPRINT

Your idea:
${idea}

BUSINESS CONCEPT
We are turning your idea into a real business.

TARGET CUSTOMER
People who need the problem solved.

OFFER
A simple service designed around the customer's problem.

MARKETING
Use social media, local outreach and online content to find customers.

NEXT STEP
Connect Soloco AI to an AI engine so it can automatically generate a complete business plan.`;

}

</script>

</body>
</html>
